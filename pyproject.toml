[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netx-termux"
version = "2.0.0"
description = "Network monitoring toolkit for Termux"
requires-python = ">=3.9"

[project.scripts]
netx = "netx.menu:main"

[tool.setuptools.packages.find]
include = ["netx*"]
